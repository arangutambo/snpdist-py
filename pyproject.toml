[project]
name = "snpdist"
version = "0.1.0"
description = "Pairwise SNP distance matrix from a FASTA alignment (NumPy), tested against the C reference implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = { text = "MIT" }
authors = [{ name = "Antoine Haddad" }]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
snpdist = "snpdist.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
